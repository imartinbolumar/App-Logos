<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Pagos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body {
                background: #ffffff !important;
                color: #0f172a !important;
                font-size: 10px !important;
            }
            .no-print {
                display: none !important;
            }
            .print-shadow-none {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
            }
            .print-overflow-visible {
                overflow: visible !important;
                max-height: none !important;
            }
            table {
                min-width: 100% !important;
                width: 100% !important;
                font-size: 9px !important;
            }
            th, td {
                padding: 4px 5px !important;
            }
            .grupo-bloque {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Navbar superior -->
    <header class="bg-white shadow-sm w-full sticky top-0 z-30 no-print">
        <div class="w-full px-4 sm:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-sm overflow-hidden">
                    <img src="/Logo_Logos.png" alt="Logotipo" class="w-10 h-10 object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">📊 Informe de Pagos</h1>
                    <p class="text-xs text-slate-500">Consulta, agrupación e impresión de estados de pago</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='/dashboard.html'" class="text-sm font-semibold text-blue-600 hover:underline bg-transparent border-none cursor-pointer">← Volver al Panel</button>
                <span id="info-usuario" class="text-sm font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg">Cargando...</span>
                <button onclick="cerrarSesion()" class="bg-red-50 text-red-600 text-sm font-semibold px-4 py-2 rounded-lg hover:bg-red-100 transition">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="w-full px-4 sm:px-8 py-6 space-y-6">

        <!-- Panel de filtros -->
        <section class="bg-white p-5 rounded-xl shadow-md border border-slate-200 space-y-4 no-print">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 items-end">

                <!-- Mes/Año Desde -->
                <div>
                    <label for="filtro-mes-desde" class="block text-xs font-semibold text-slate-700 mb-1">Mes / Año Desde:</label>
                    <input type="month" id="filtro-mes-desde" onchange="renderizarInforme()"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                </div>

                <!-- Mes/Año Hasta -->
                <div>
                    <label for="filtro-mes-hasta" class="block text-xs font-semibold text-slate-700 mb-1">Mes / Año Hasta:</label>
                    <input type="month" id="filtro-mes-hasta" onchange="renderizarInforme()"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                </div>

                <!-- Alumno (autocomplete / vacío = todos) -->
                <div class="relative">
                    <label for="filtro-alumno-texto" class="block text-xs font-semibold text-slate-700 mb-1">Alumno (vacío = todos):</label>
                    <div class="relative flex items-center">
                        <input type="text" id="filtro-alumno-texto"
                               oninput="manejarInputAlumnoFiltro()"
                               onfocus="mostrarSugerenciasFiltroAlumno()"
                               autocomplete="off"
                               placeholder="🔍 Todos los alumnos..."
                               class="w-full px-3 py-2 pr-8 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <button type="button" id="btn-limpiar-alumno" onclick="limpiarFiltroAlumno()" title="Mostrar todos los alumnos"
                                class="hidden absolute right-2 text-slate-400 hover:text-slate-700 text-xs font-bold">✕</button>
                    </div>
                    <input type="hidden" id="filtro-alumno-id" value="">
                    <div id="sugerencias-filtro-alumno"
                         class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto border border-slate-200 rounded-xl bg-white shadow-xl divide-y divide-slate-100 z-40">
                    </div>
                </div>

                <!-- Todos o solo deuda -->
                <div>
                    <label for="filtro-deuda" class="block text-xs font-semibold text-slate-700 mb-1">Estado de deuda:</label>
                    <select id="filtro-deuda" onchange="renderizarInforme()"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-medium">
                        <option value="todos">Todos los alumnos</option>
                        <option value="deuda">Solo con deuda</option>
                    </select>
                </div>

                <!-- Agrupación: mes a mes o alumno a alumno -->
                <div>
                    <label for="filtro-agrupacion" class="block text-xs font-semibold text-slate-700 mb-1">Ver informe:</label>
                    <select id="filtro-agrupacion" onchange="renderizarInforme()"
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-medium">
                        <option value="mes">Por meses</option>
                        <option value="alumno">Por alumnos</option>
                    </select>
                </div>

                <!-- Botones acciones -->
                <div class="flex items-center gap-2">
                    <button type="button" onclick="limpiarTodosFiltros()" title="Vaciar filtros para ver todo el historial"
                            class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition">
                        Todo el historial
                    </button>
                    <button type="button" onclick="imprimirInforme()"
                            class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                        🖨️ Imprimir
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs text-slate-500">
                <span id="resumen-filtros-texto">Mostrando todo el historial disponible.</span>
                <span id="estado-carga-informe" class="font-semibold text-blue-600">Cargando datos...</span>
            </div>
        </section>

        <!-- Cabecera visible solo o destacada en informe / impresión -->
        <section id="cabecera-informe-impresion" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 print-shadow-none flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div>
                <h2 class="text-lg font-bold text-slate-900">Informe Detallado de Pagos</h2>
                <p id="subtitulo-informe" class="text-xs text-slate-600">Rango: Todo el historial · Alumnos: Todos · Agrupación: Mes a mes</p>
            </div>
            <div class="text-xs text-slate-500">
                <span>Registros mostrados: <strong id="contador-registros-informe" class="text-slate-800">0</strong></span>
            </div>
        </section>

        <!-- Contenedor dinámico del informe agrupado -->
        <section id="contenedor-informe" class="space-y-6"></section>

    </main>

    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuario') || '{}');
        document.getElementById('info-usuario').textContent = `👤 ${usuarioGuardado.nombre || 'Usuario'} (${(usuarioGuardado.rol || 'PROFE').toUpperCase()})`;

        let alumnosCache = [];
        let tarifasListaCache = [];
        let registrosInforme = [];

        const codigosTarifasOrden = ["REF P", "REF S", "REF B", "DA", "DA C", "LOG", "LOG M"];

        function cerrarSesion() {
            fetch('/api/logout', { method: 'POST' }).finally(() => {
                localStorage.removeItem('usuario');
                window.location.replace('/index.html');
            });
        }

        function formatearMoneda(valor) {
            const num = parseFloat(valor) || 0;
            const partes = num.toFixed(2).split('.');
            partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            return `${partes.join(',')} €`;
        }

        function parsearImporteTexto(texto) {
            if (typeof texto === 'number') return texto;
            if (!texto) return 0;
            const limpio = String(texto).replace(/€/g, '').replace(/\./g, '').replace(/,/g, '.').trim();
            return parseFloat(limpio) || 0;
        }

        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\w\s]/gi, '').trim();
        }

        function formatearNombreMes(mesStr) {
            if (!mesStr || !/^\d{4}-\d{2}$/.test(mesStr)) return mesStr || 'Sin mes';
            const [anio, mes] = mesStr.split('-').map(Number);
            const fecha = new Date(anio, mes - 1, 1);
            const nombreMes = fecha.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            return `${nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1)} (${mesStr})`;
        }

        function normalizarFechaISO(fechaRaw) {
            if (!fechaRaw) return '';
            const s = String(fechaRaw).trim();
            const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (mIso) return `${mIso[1]}-${mIso[2]}-${mIso[3]}`;
            const mEs = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (mEs) return `${mEs[3]}-${mEs[2].padStart(2, '0')}-${mEs[1].padStart(2, '0')}`;
            return '';
        }

        function extraerPrecioSesionTarifa(t) {
            if (!t) return 0;
            const raw = t.tarifa_por_sesion ?? t.tarifa_por_Sesion ?? t.precio_sesion ?? t.precio_1h ?? t.precio ?? t.importe ?? 0;
            return parsearImporteTexto(raw);
        }

        function obtenerTarifaGeneralPorTipo(tipoBuscado, mesStr, codigosAlternativos = []) {
            const lista = tarifasListaCache || [];
            const objetivo = String(tipoBuscado || '').toUpperCase().trim();
            const alternativos = (codigosAlternativos || []).map(c => String(c).toUpperCase().trim());

            const coincideTipo = (t) => {
                const tipo = String(t.tipo_servicio ?? t.tipo_Servicio ?? '').toUpperCase().trim();
                const codigo = String(t.codigo ?? '').toUpperCase().trim();
                if (tipo === objetivo) return true;
                if (!tipo && codigo === objetivo) return true;
                return alternativos.includes(tipo) || alternativos.includes(codigo);
            };
            const estaActiva = (t) => t.activa === undefined || t.activa === null || Number(t.activa) !== 0;

            if (!mesStr) {
                const tarifaFallback = lista.find(t => coincideTipo(t) && estaActiva(t));
                return tarifaFallback ? extraerPrecioSesionTarifa(tarifaFallback) : 0;
            }

            const [anio, mes] = mesStr.split('-').map(Number);
            const inicioMes = `${anio}-${String(mes).padStart(2, '0')}-01`;
            const ultimoDia = new Date(anio, mes, 0).getDate();
            const finMes = `${anio}-${String(mes).padStart(2, '0')}-${String(ultimoDia).padStart(2, '0')}`;

            const candidatas = lista.filter(t => {
                if (!coincideTipo(t) || !estaActiva(t)) return false;
                const fIni = normalizarFechaISO(t.fecha_inicio);
                const fFin = normalizarFechaISO(t.fecha_fin);
                return (!fIni || fIni <= finMes) && (!fFin || fFin >= inicioMes);
            });

            if (candidatas.length > 0) {
                candidatas.sort((a, b) => normalizarFechaISO(b.fecha_inicio).localeCompare(normalizarFechaISO(a.fecha_inicio)));
                const precio = extraerPrecioSesionTarifa(candidatas[0]);
                if (precio > 0) return precio;
            }

            const fallbackTipo = lista.find(t => coincideTipo(t) && estaActiva(t) && extraerPrecioSesionTarifa(t) > 0);
            return fallbackTipo ? extraerPrecioSesionTarifa(fallbackTipo) : 0;
        }

        function obtenerTarifaGeneralTE(mesStr) {
            return obtenerTarifaGeneralPorTipo('TE', mesStr, ['TERAPIA', 'TERAPIAS']);
        }

        function obtenerTarifaGeneralEV(mesStr) {
            return obtenerTarifaGeneralPorTipo('EV', mesStr, ['EVALUACION', 'EVALUACIONES']);
        }

        async function fetchJSONSafe(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                console.warn(`Error al consultar ${url}:`, e);
                return null;
            }
        }

        function calcularDetalleRegistro(raw, mapaAlumnos) {
            const alumnoId = raw.alumno_id;
            const alumnoObj = mapaAlumnos.get(String(alumnoId)) || {};
            const nombreAlumno = raw.nombreAlumno
                || `${alumnoObj.nombre || ''} ${alumnoObj.apellidos || ''}`.trim()
                || `Alumno #${alumnoId}`;

            const mes = String(raw.mes || '').slice(0, 7);
            const pendAnt = parseFloat(raw.pendiente_mes_anterior || 0);
            const cobroExtra = parseFloat(raw.cobro_extra || 0);
            const pagosExtra = parseFloat(raw.otros_pagos || 0);

            const tarifas = raw.tarifas || {
                "REF P": raw.ref_p || 0,
                "REF S": raw.ref_s || 0,
                "REF B": raw.ref_b || 0,
                "DA": raw.da || 0,
                "DA C": raw.da_c || 0,
                "LOG": raw.log || 0,
                "LOG M": raw.log_m || 0
            };

            let subtotalClases = 0;
            const cantidadRefP = parseInt(tarifas["REF P"]) || 0;
            if (cantidadRefP > 0) {
                const tarifaRefId = alumnoObj.tarifa_refuerzo_id;
                const horasRef = parseInt(alumnoObj.horas_refuerzo, 10);
                const tarifaObj = tarifaRefId
                    ? tarifasListaCache.find(t =>
                        String(t.id) === String(tarifaRefId) &&
                        String(t.codigo || '').toUpperCase().trim() === 'REF P'
                    )
                    : null;
                if (tarifaObj && horasRef >= 1 && horasRef <= 5) {
                    const parsed = parsearImporteTexto(tarifaObj[`precio_${horasRef}h`]);
                    if (!isNaN(parsed) && parsed > 0) subtotalClases += parsed;
                }
            }

            const mappingServicios = {
                "REF S": { tarifaId: alumnoObj.tarifa_refuerzo_id, horas: alumnoObj.horas_refuerzo },
                "REF B": { tarifaId: alumnoObj.tarifa_refuerzo_id, horas: alumnoObj.horas_refuerzo },
                "DA":    { tarifaId: alumnoObj.tarifa_dificultad_id, horas: alumnoObj.horas_dificultad },
                "DA C":  { tarifaId: alumnoObj.tarifa_dificultad_id, horas: alumnoObj.horas_dificultad },
                "LOG":   { tarifaId: alumnoObj.tarifa_logopedia_id, horas: alumnoObj.horas_logopedia },
                "LOG M": { tarifaId: alumnoObj.tarifa_logopedia_id, horas: alumnoObj.horas_logopedia }
            };

            Object.keys(mappingServicios).forEach(cod => {
                const cant = parseInt(tarifas[cod]) || 0;
                if (cant > 0) {
                    const cfg = mappingServicios[cod];
                    if (cfg && cfg.tarifaId && cfg.horas > 0) {
                        const tarifaObj = tarifasListaCache.find(t => String(t.id) === String(cfg.tarifaId));
                        if (tarifaObj) {
                            const h = parseInt(cfg.horas, 10);
                            if (h >= 1 && h <= 5) {
                                subtotalClases += parsearImporteTexto(tarifaObj[`precio_${h}h`]);
                            }
                        }
                    }
                }
            });

            const totalC = parseFloat(raw.total_clases);
            const numC = parseFloat(raw.num_clases);
            let pctDto = 0;
            if (!isNaN(totalC) && totalC > 0 && !isNaN(numC)) {
                pctDto = Math.max(0, numC / totalC);
            }

            const importeClases = (raw.importe_clases !== undefined && raw.importe_clases !== null)
                ? parseFloat(raw.importe_clases) || 0
                : subtotalClases * (1 - pctDto);
            const pagadoClases = parseFloat(raw.importe_pagado_clases || 0);
            const pendienteClases = importeClases - pagadoClases;

            const terapias = raw.terapias || [
                raw.terapia_1 || '', raw.terapia_2 || '', raw.terapia_3 || '',
                raw.terapia_4 || '', raw.terapia_5 || '', raw.terapia_6 || ''
            ];
            const terapiasPagado = raw.terapias_pagado || [
                raw.terapia_1_pagado === 1 || raw.terapia_1_pagado === true,
                raw.terapia_2_pagado === 1 || raw.terapia_2_pagado === true,
                raw.terapia_3_pagado === 1 || raw.terapia_3_pagado === true,
                raw.terapia_4_pagado === 1 || raw.terapia_4_pagado === true,
                raw.terapia_5_pagado === 1 || raw.terapia_5_pagado === true,
                raw.terapia_6_pagado === 1 || raw.terapia_6_pagado === true
            ];

            let totalTerapiasValidas = 0;
            let totalTerapiasPagadas = 0;
            terapias.forEach((t, idx) => {
                if (t && String(t).trim() !== '') {
                    totalTerapiasValidas++;
                    if (terapiasPagado[idx]) totalTerapiasPagadas++;
                }
            });

            const precioAlumno = parsearImporteTexto(alumnoObj.precio_tarifa ?? alumnoObj.precio_terapia ?? raw.precioTerapiaAlumno ?? 0);
            const precioTerapiaAplicar = precioAlumno > 0 ? precioAlumno : obtenerTarifaGeneralTE(mes);

            const importeTerapias = (raw.importe_terapias !== undefined && raw.importe_terapias !== null)
                ? parseFloat(raw.importe_terapias) || 0
                : totalTerapiasValidas * precioTerapiaAplicar;
            const pagadoTerapias = (raw.importe_pagado_terapias !== undefined && raw.importe_pagado_terapias !== null)
                ? parseFloat(raw.importe_pagado_terapias) || 0
                : totalTerapiasPagadas * precioTerapiaAplicar;
            const pendienteTerapias = importeTerapias - pagadoTerapias;

            const tieneEvaluacion = raw.evaluacion === 1 || raw.evaluacion === true;
            const importeEvaluaciones = (raw.importe_evaluaciones !== undefined && raw.importe_evaluaciones !== null)
                ? parseFloat(raw.importe_evaluaciones) || 0
                : (tieneEvaluacion ? obtenerTarifaGeneralEV(mes) : 0);

            const totalImporteMes = (raw.total_final !== undefined && raw.total_final !== null)
                ? parseFloat(raw.total_final) || 0
                : (pendAnt + cobroExtra + importeClases + importeTerapias + importeEvaluaciones);

            const totalPagado = (raw.total_pagado !== undefined && raw.total_pagado !== null)
                ? parseFloat(raw.total_pagado) || 0
                : (pagosExtra + pagadoClases + pagadoTerapias);

            const totalPendiente = totalImporteMes - totalPagado;

            return {
                alumno_id: alumnoId,
                nombreAlumno,
                mes,
                pendiente_mes_anterior: pendAnt,
                cobro_extra: cobroExtra,
                pagos_extra: pagosExtra,
                importe_clases: importeClases,
                pagado_clases: pagadoClases,
                pendiente_clases: pendienteClases,
                importe_terapias: importeTerapias,
                pagado_terapias: pagadoTerapias,
                pendiente_terapias: pendienteTerapias,
                importe_evaluaciones: importeEvaluaciones,
                total_importe_mes: totalImporteMes,
                total_pagado: totalPagado,
                total_pendiente: totalPendiente
            };
        }

        async function cargarHistorialCompleto() {
            const estadoEl = document.getElementById('estado-carga-informe');
            estadoEl.textContent = 'Cargando historial...';

            const [alumnosData, tarifasData, hojaTodosData] = await Promise.all([
                fetchJSONSafe('/api/alumnos'),
                fetchJSONSafe('/api/tarifas'),
                fetchJSONSafe('/api/hoja-pago')
            ]);

            alumnosCache = Array.isArray(alumnosData) ? alumnosData : [];
            tarifasListaCache = Array.isArray(tarifasData) ? tarifasData : [];

            const mapaAlumnos = new Map();
            alumnosCache.forEach(a => mapaAlumnos.set(String(a.id), a));

            let filasBrutas = [];
            if (Array.isArray(hojaTodosData) && hojaTodosData.length > 0) {
                filasBrutas = hojaTodosData;
            } else {
                // Respaldo si el endpoint requiere parámetro ?mes=
                const hoy = new Date();
                const mesesCandidatos = [];
                for (let i = -24; i <= 3; i++) {
                    const d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
                    mesesCandidatos.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
                const resultadosPorMes = await Promise.all(
                    mesesCandidatos.map(m => fetchJSONSafe(`/api/hoja-pago?mes=${m}`))
                );
                resultadosPorMes.forEach((lista, idx) => {
                    if (Array.isArray(lista)) {
                        lista.forEach(item => filasBrutas.push({ ...item, mes: item.mes || mesesCandidatos[idx] }));
                    }
                });
            }

            registrosInforme = filasBrutas
                .filter(r => r && r.alumno_id && r.mes)
                .map(r => calcularDetalleRegistro(r, mapaAlumnos));

            estadoEl.textContent = `Historial cargado (${registrosInforme.length} registros)`;
            renderizarInforme();
        }

        function manejarInputAlumnoFiltro() {
            const inputEl = document.getElementById('filtro-alumno-texto');
            const hiddenIdEl = document.getElementById('filtro-alumno-id');
            const btnLimpiar = document.getElementById('btn-limpiar-alumno');

            btnLimpiar.classList.toggle('hidden', !inputEl.value.trim());

            if (hiddenIdEl.value) {
                const alumnoSel = alumnosCache.find(a => String(a.id) === String(hiddenIdEl.value));
                const nombreSel = alumnoSel ? `${alumnoSel.nombre || ''} ${alumnoSel.apellidos || ''}`.trim() : '';
                if (inputEl.value.trim() !== nombreSel) {
                    hiddenIdEl.value = '';
                }
            }

            mostrarSugerenciasFiltroAlumno();
            renderizarInforme();
        }

        function mostrarSugerenciasFiltroAlumno() {
            const inputEl = document.getElementById('filtro-alumno-texto');
            const listaEl = document.getElementById('sugerencias-filtro-alumno');
            const textoNorm = normalizarTexto(inputEl.value);

            const ordenados = [...alumnosCache].sort((a, b) =>
                `${a.nombre || ''} ${a.apellidos || ''}`.localeCompare(`${b.nombre || ''} ${b.apellidos || ''}`, 'es', { sensitivity: 'base' })
            );

            const coincidencias = ordenados.filter(a => {
                const nombreComp = `${a.nombre || ''} ${a.apellidos || ''}`.trim();
                return !textoNorm || normalizarTexto(nombreComp).includes(textoNorm);
            });

            listaEl.innerHTML = '';
            if (coincidencias.length === 0) {
                listaEl.innerHTML = `<div class="px-3 py-2 text-xs text-slate-400">No hay alumnos que coincidan.</div>`;
                listaEl.classList.remove('hidden');
                return;
            }

            coincidencias.slice(0, 15).forEach(a => {
                const nombreComp = `${a.nombre || ''} ${a.apellidos || ''}`.trim();
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-full text-left px-3 py-2 text-xs font-medium text-slate-700 hover:bg-blue-50 hover:text-blue-800 transition';
                btn.textContent = nombreComp;
                btn.onclick = () => {
                    inputEl.value = nombreComp;
                    document.getElementById('filtro-alumno-id').value = String(a.id);
                    document.getElementById('btn-limpiar-alumno').classList.remove('hidden');
                    listaEl.classList.add('hidden');
                    renderizarInforme();
                };
                listaEl.appendChild(btn);
            });

            listaEl.classList.remove('hidden');
        }

        function limpiarFiltroAlumno() {
            document.getElementById('filtro-alumno-texto').value = '';
            document.getElementById('filtro-alumno-id').value = '';
            document.getElementById('btn-limpiar-alumno').classList.add('hidden');
            document.getElementById('sugerencias-filtro-alumno').classList.add('hidden');
            renderizarInforme();
        }

        function limpiarTodosFiltros() {
            document.getElementById('filtro-mes-desde').value = '';
            document.getElementById('filtro-mes-hasta').value = '';
            document.getElementById('filtro-alumno-texto').value = '';
            document.getElementById('filtro-alumno-id').value = '';
            document.getElementById('btn-limpiar-alumno').classList.add('hidden');
            document.getElementById('filtro-deuda').value = 'todos';
            document.getElementById('filtro-agrupacion').value = 'mes';
            renderizarInforme();
        }

        document.addEventListener('click', (e) => {
            const cont = document.getElementById('filtro-alumno-texto')?.parentElement?.parentElement;
            const lista = document.getElementById('sugerencias-filtro-alumno');
            if (cont && lista && !cont.contains(e.target)) {
                lista.classList.add('hidden');
            }
        });

        function filtrarRegistros() {
            const mesDesde = document.getElementById('filtro-mes-desde').value;
            const mesHasta = document.getElementById('filtro-mes-hasta').value;
            const alumnoIdSel = document.getElementById('filtro-alumno-id').value;
            const alumnoTexto = normalizarTexto(document.getElementById('filtro-alumno-texto').value);
            const soloDeuda = document.getElementById('filtro-deuda').value === 'deuda';

            return registrosInforme.filter(reg => {
                const mesReg = String(reg.mes || '').slice(0, 7);
                if (mesDesde && mesReg < mesDesde) return false;
                if (mesHasta && mesReg > mesHasta) return false;

                if (alumnoIdSel) {
                    if (String(reg.alumno_id) !== String(alumnoIdSel)) return false;
                } else if (alumnoTexto) {
                    if (!normalizarTexto(reg.nombreAlumno).includes(alumnoTexto)) return false;
                }

                if (soloDeuda) {
                    if ((parseFloat(reg.total_pendiente) || 0) <= 0.009) return false;
                }

                return true;
            });
        }

        function sumarRegistros(lista) {
            return lista.reduce((acc, r) => {
                acc.pendiente_mes_anterior += r.pendiente_mes_anterior || 0;
                acc.cobro_extra += r.cobro_extra || 0;
                acc.pagos_extra += r.pagos_extra || 0;
                acc.importe_clases += r.importe_clases || 0;
                acc.pagado_clases += r.pagado_clases || 0;
                acc.pendiente_clases += r.pendiente_clases || 0;
                acc.importe_terapias += r.importe_terapias || 0;
                acc.pagado_terapias += r.pagado_terapias || 0;
                acc.pendiente_terapias += r.pendiente_terapias || 0;
                acc.importe_evaluaciones += r.importe_evaluaciones || 0;
                acc.total_importe_mes += r.total_importe_mes || 0;
                acc.total_pagado += r.total_pagado || 0;
                acc.total_pendiente += r.total_pendiente || 0;
                return acc;
            }, {
                pendiente_mes_anterior: 0,
                cobro_extra: 0,
                pagos_extra: 0,
                importe_clases: 0,
                pagado_clases: 0,
                pendiente_clases: 0,
                importe_terapias: 0,
                pagado_terapias: 0,
                pendiente_terapias: 0,
                importe_evaluaciones: 0,
                total_importe_mes: 0,
                total_pagado: 0,
                total_pendiente: 0
            });
        }

        function renderizarInforme() {
            const mesDesde = document.getElementById('filtro-mes-desde').value;
            const mesHasta = document.getElementById('filtro-mes-hasta').value;
            const alumnoTexto = document.getElementById('filtro-alumno-texto').value.trim();
            const modoDeuda = document.getElementById('filtro-deuda').value;
            const agrupacion = document.getElementById('filtro-agrupacion').value;

            const textoRango = (!mesDesde && !mesHasta)
                ? 'Todo el historial'
                : `${mesDesde || 'Inicio'} a ${mesHasta || 'Fin'}`;
            const textoAlumno = alumnoTexto || 'Todos';
            const textoDeuda = modoDeuda === 'deuda' ? 'Solo con deuda' : 'Todos';
            const textoAgrup = agrupacion === 'alumno' ? 'Alumno a alumno' : 'Mes a mes';

            document.getElementById('subtitulo-informe').textContent =
                `Rango: ${textoRango} · Alumno: ${textoAlumno} · Estado: ${textoDeuda} · Agrupación: ${textoAgrup}`;
            document.getElementById('resumen-filtros-texto').textContent =
                (mesDesde || mesHasta) ? `Filtrado por rango ${textoRango}` : 'Sin rango de fechas: mostrando todo el historial disponible.';

            const filtrados = filtrarRegistros();
            document.getElementById('contador-registros-informe').textContent = filtrados.length;

            const contenedor = document.getElementById('contenedor-informe');
            contenedor.innerHTML = '';

            if (filtrados.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-white p-10 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500 text-sm">
                        No hay registros que coincidan con los criterios seleccionados.
                    </div>
                `;
                return;
            }

            const gruposMap = new Map();

            if (agrupacion === 'alumno') {
                const ordenados = [...filtrados].sort((a, b) => {
                    const cmpNom = a.nombreAlumno.localeCompare(b.nombreAlumno, 'es', { sensitivity: 'base' });
                    if (cmpNom !== 0) return cmpNom;
                    return String(a.mes).localeCompare(String(b.mes));
                });

                ordenados.forEach(reg => {
                    const clave = String(reg.alumno_id);
                    if (!gruposMap.has(clave)) {
                        gruposMap.set(clave, {
                            titulo: reg.nombreAlumno,
                            subtitulo: 'Agrupación por alumno',
                            columnaContexto: 'Mes',
                            items: []
                        });
                    }
                    gruposMap.get(clave).items.push(reg);
                });
            } else {
                const ordenados = [...filtrados].sort((a, b) => {
                    const cmpMes = String(a.mes).localeCompare(String(b.mes));
                    if (cmpMes !== 0) return cmpMes;
                    return a.nombreAlumno.localeCompare(b.nombreAlumno, 'es', { sensitivity: 'base' });
                });

                ordenados.forEach(reg => {
                    const clave = String(reg.mes);
                    if (!gruposMap.has(clave)) {
                        gruposMap.set(clave, {
                            titulo: formatearNombreMes(reg.mes),
                            subtitulo: 'Agrupación mensual',
                            columnaContexto: 'Alumno',
                            items: []
                        });
                    }
                    gruposMap.get(clave).items.push(reg);
                });
            }

            gruposMap.forEach((grupo) => {
                const sum = sumarRegistros(grupo.items);
                const esPorAlumno = agrupacion === 'alumno';

                const filasHtml = grupo.items.map((r, idx) => {
                    const etiquetaContexto = esPorAlumno ? (r.mes || '-') : r.nombreAlumno;
                    const bgRow = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/70';
                    const clasePendiente = r.total_pendiente > 0.009 ? 'text-red-700 font-extrabold' : 'text-amber-700 font-bold';

                    return `
                        <tr class="${bgRow} border-b border-slate-200 hover:bg-blue-50/40">
                            <td class="py-2 px-2.5 font-semibold text-slate-800 border-r whitespace-nowrap">${etiquetaContexto}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r">${formatearMoneda(r.pendiente_mes_anterior)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r">${formatearMoneda(r.cobro_extra)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r">${formatearMoneda(r.pagos_extra)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-sky-50/30">${formatearMoneda(r.importe_clases)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-sky-50/30 text-teal-700">${formatearMoneda(r.pagado_clases)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-sky-50/30 text-amber-700">${formatearMoneda(r.pendiente_clases)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-teal-50/30">${formatearMoneda(r.importe_terapias)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-teal-50/30 text-teal-700">${formatearMoneda(r.pagado_terapias)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-teal-50/30 text-amber-700">${formatearMoneda(r.pendiente_terapias)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-purple-50/30">${formatearMoneda(r.importe_evaluaciones)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-blue-50/70 font-extrabold text-blue-900">${formatearMoneda(r.total_importe_mes)}</td>
                            <td class="py-2 px-2 text-right tabular-nums border-r bg-emerald-50/70 font-extrabold text-emerald-800">${formatearMoneda(r.total_pagado)}</td>
                            <td class="py-2 px-2 text-right tabular-nums bg-amber-50/80 ${clasePendiente}">${formatearMoneda(r.total_pendiente)}</td>
                        </tr>
                    `;
                }).join('');

                const bloque = document.createElement('div');
                bloque.className = 'grupo-bloque bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden print-shadow-none';
                bloque.innerHTML = `
                    <div class="px-4 py-3 bg-slate-800 text-white flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm">${grupo.titulo}</span>
                            <span class="text-[11px] bg-slate-700 text-slate-200 px-2 py-0.5 rounded-full">${grupo.items.length} ${grupo.items.length === 1 ? 'registro' : 'registros'}</span>
                        </div>
                        <span class="text-xs text-slate-300">${grupo.subtitulo}</span>
                    </div>
                    <div class="overflow-x-auto print-overflow-visible">
                        <table class="w-full text-left border-collapse text-xs min-w-[1380px]">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-b border-slate-300 text-[10px] font-bold uppercase text-center">
                                    <th class="py-2 px-2.5 border-r text-left">${grupo.columnaContexto}</th>
                                    <th class="py-2 px-2 border-r">Pdte. Mes Ant.</th>
                                    <th class="py-2 px-2 border-r">Cobros Extra</th>
                                    <th class="py-2 px-2 border-r">Pagos Extra</th>
                                    <th class="py-2 px-2 border-r bg-sky-100/60">Imp. Clases</th>
                                    <th class="py-2 px-2 border-r bg-sky-100/60">Pagado Clases</th>
                                    <th class="py-2 px-2 border-r bg-sky-100/60">Pdte. Clases</th>
                                    <th class="py-2 px-2 border-r bg-teal-100/60">Imp. Terapias</th>
                                    <th class="py-2 px-2 border-r bg-teal-100/60">Pagado Terapias</th>
                                    <th class="py-2 px-2 border-r bg-teal-100/60">Pdte. Terapias</th>
                                    <th class="py-2 px-2 border-r bg-purple-100/60">Imp. Evaluaciones</th>
                                    <th class="py-2 px-2 border-r bg-blue-100 text-blue-950">Total Importe Mes</th>
                                    <th class="py-2 px-2 border-r bg-emerald-100 text-emerald-950">Total Pagado</th>
                                    <th class="py-2 px-2 bg-amber-100 text-amber-950">Pendiente</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filasHtml}
                            </tbody>
                            <tfoot>
                                <tr class="bg-slate-200 text-slate-900 font-extrabold border-t-2 border-slate-400 text-xs">
                                    <td class="py-2.5 px-2.5 border-r uppercase text-[11px]">Suma ${grupo.titulo}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r">${formatearMoneda(sum.pendiente_mes_anterior)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r">${formatearMoneda(sum.cobro_extra)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r">${formatearMoneda(sum.pagos_extra)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r">${formatearMoneda(sum.importe_clases)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r text-teal-800">${formatearMoneda(sum.pagado_clases)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r text-amber-800">${formatearMoneda(sum.pendiente_clases)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r">${formatearMoneda(sum.importe_terapias)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r text-teal-800">${formatearMoneda(sum.pagado_terapias)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r text-amber-800">${formatearMoneda(sum.pendiente_terapias)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r">${formatearMoneda(sum.importe_evaluaciones)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r bg-blue-200/80 text-blue-950">${formatearMoneda(sum.total_importe_mes)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums border-r bg-emerald-200/80 text-emerald-950">${formatearMoneda(sum.total_pagado)}</td>
                                    <td class="py-2.5 px-2 text-right tabular-nums bg-amber-200/90 text-amber-950">${formatearMoneda(sum.total_pendiente)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                contenedor.appendChild(bloque);
            });

            // Sumatorio total general del informe
            if (gruposMap.size > 1) {
                const totGen = sumarRegistros(filtrados);
                const cajaTotalGeneral = document.createElement('div');
                cajaTotalGeneral.className = 'grupo-bloque bg-slate-900 text-white rounded-xl p-4 shadow-md print-shadow-none';
                cajaTotalGeneral.innerHTML = `
                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                        <div class="text-xs uppercase tracking-wider font-bold text-slate-300">
                            Total General del Informe (${filtrados.length} registros)
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-right">
                            <div class="bg-blue-950/90 border border-blue-700/60 rounded-lg px-3.5 py-2">
                                <div class="text-[10px] uppercase text-blue-200 font-semibold">Total Importe Mes</div>
                                <div class="text-sm font-extrabold tabular-nums text-white">${formatearMoneda(totGen.total_importe_mes)}</div>
                            </div>
                            <div class="bg-emerald-950/90 border border-emerald-700/60 rounded-lg px-3.5 py-2">
                                <div class="text-[10px] uppercase text-emerald-200 font-semibold">Total Pagado</div>
                                <div class="text-sm font-extrabold tabular-nums text-white">${formatearMoneda(totGen.total_pagado)}</div>
                            </div>
                            <div class="bg-amber-950/90 border border-amber-700/60 rounded-lg px-3.5 py-2">
                                <div class="text-[10px] uppercase text-amber-200 font-semibold">Total Pendiente</div>
                                <div class="text-sm font-extrabold tabular-nums text-amber-200">${formatearMoneda(totGen.total_pendiente)}</div>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.appendChild(cajaTotalGeneral);
            }
        }

        function imprimirInforme() {
            window.print();
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarHistorialCompleto();
        });
    </script>
</body>
</html>
