<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tipos de Servicio y Tarifas (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen overflow-hidden">
    
    <!-- Contenedor Superior Fijo (Navbar) -->
    <div class="z-40 bg-slate-100 shadow-sm">
        <!-- Navbar superior -->
        <header class="bg-white shadow-sm border-b border-slate-200">
            <div class="w-full px-4 sm:px-8 py-3.5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-sm">
                        <img src="/Logo_Logos.png" alt="Logotipo" class="w-10 h-10 object-contain">
                    </div>
                    <h1 class="text-xl font-bold text-slate-800">💶 Configuración de Tarifas y Servicios (Admin)</h1>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Volver al Panel</a>
                    <span id="info-usuario" class="text-sm font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg">Cargando...</span>
                    <button onclick="cerrarSesion()" class="bg-red-50 text-red-600 text-sm font-semibold px-4 py-2 rounded-lg hover:bg-red-100 transition">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>
    </div>

    <!-- Contenido Principal con Scroll Independiente por Bloque -->
    <main class="w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Formulario (Izquierda) - SCROLL INDEPENDIENTE -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-3 h-[calc(100vh-7rem)] overflow-y-auto">
            <form id="form-tarifa" onsubmit="guardarTarifa(event)" autocomplete="off" class="space-y-4">
                <input type="hidden" id="tarifa-id">
                
                <div class="flex justify-between items-center pb-3 border-b sticky top-0 bg-white z-10">
                    <h2 id="form-titulo" class="text-lg font-bold text-slate-800">Nueva Tarifa</h2>
                    <div class="flex gap-2">
                        <!-- Botón Borrar (Solo visible al editar) -->
                        <button type="button" id="btn-borrar" onclick="borrarTarifaActual()" class="hidden bg-red-50 text-red-600 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-red-100 transition">
                            Borrar
                        </button>
                        <button type="button" id="btn-cancelar" onclick="limpiarFormulario()" class="hidden bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-slate-300 transition">
                            Cancelar
                        </button>
                        <button type="submit" id="btn-guardar" class="bg-blue-600 text-white text-xs font-semibold px-4 py-1.5 rounded-lg hover:bg-blue-700 shadow-sm transition">
                            Guardar
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Tipo de Servicio</label>
                        <select id="tipo_servicio" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="">-- Seleccionar Tipo --</option>
                            <option value="Refuerzo">Refuerzo</option>
                            <option value="Dificultad">Dificultad</option>
                            <option value="Logopedia">Logopedia</option>
                            <option value="Terapia">Terapia</option>
                            <option value="Evaluación">Evaluación</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Código / Subtipo</label>
                            <input type="text" id="codigo" required placeholder="Ej. MAT-ESO" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 uppercase">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Tarifa / Sesión (€)</label>
                            <input type="number" step="0.01" id="tarifa_por_sesion" placeholder="0.00" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Descripción</label>
                        <textarea id="descripcion" rows="2" placeholder="Detalle del código..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>

                    <!-- Precios por horas semanales -->
                    <div class="border-t pt-2">
                        <label class="block text-xs font-bold text-slate-700 mb-2">Precios según Horas / Semana (€)</label>
                        <div class="grid grid-cols-5 gap-1 text-center">
                            <div><span class="text-[10px] text-slate-500">1h</span><input type="number" step="0.01" id="precio_1h" class="w-full px-1 py-1 text-xs border rounded text-center"></div>
                            <div><span class="text-[10px] text-slate-500">2h</span><input type="number" step="0.01" id="precio_2h" class="w-full px-1 py-1 text-xs border rounded text-center"></div>
                            <div><span class="text-[10px] text-slate-500">3h</span><input type="number" step="0.01" id="precio_3h" class="w-full px-1 py-1 text-xs border rounded text-center"></div>
                            <div><span class="text-[10px] text-slate-500">4h</span><input type="number" step="0.01" id="precio_4h" class="w-full px-1 py-1 text-xs border rounded text-center"></div>
                            <div><span class="text-[10px] text-slate-500">5h</span><input type="number" step="0.01" id="precio_5h" class="w-full px-1 py-1 text-xs border rounded text-center"></div>
                        </div>
                    </div>

                    <!-- Vigencia -->
                    <div class="grid grid-cols-2 gap-2 border-t pt-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Fecha Inicio Validez</label>
                            <input type="date" id="fecha_inicio" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Fecha Fin Validez</label>
                            <input type="date" id="fecha_fin" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Listado (Derecha) - SCROLL INDEPENDIENTE -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-9 h-[calc(100vh-7rem)] overflow-hidden flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-lg font-bold text-slate-800">Tarifas Registradas</h2>
                
                <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
                    <!-- Filtro de Activas a Día Actual -->
                    <label class="flex items-center gap-1.5 text-xs font-medium text-slate-700 bg-slate-50 px-3 py-2 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-100">
                        <input type="checkbox" id="filtro-activas-hoy" checked onchange="filtrarTarifas()" class="rounded text-blue-600 focus:ring-blue-500">
                        <span>Solo vigentes</span>
                    </label>

                    <!-- Buscador por texto -->
                    <input type="text" id="buscador" oninput="filtrarTarifas()" placeholder="🔍 Buscar servicio o código..." class="w-full sm:w-56 px-3 py-2 text-sm border border-slate-300 rounded-lg">
                </div>
            </div>

            <div class="overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase sticky top-0 bg-white shadow-sm z-10">
                            <th class="py-2 px-3">Servicio / Código</th>
                            <th class="py-2 px-3">Precios (1h - 5h)</th>
                            <th class="py-2 px-3">Sesión</th>
                            <th class="py-2 px-3">Validez</th>
                            <th class="py-2 px-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-tarifas" class="text-slate-700 text-sm">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // 🛡️ RESTRICCIÓN DE SEGURIDAD: Solo rol admin
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuario') || '{}');       
                
        if (usuarioGuardado.rol !== 'admin' && usuarioGuardado.rol !== 'admin_profesor') {
            alert("⚠️ Acceso denegado. Esta sección es exclusiva para administradores.");
            window.location.replace('/dashboard.html');
        } else {
            document.getElementById('info-usuario').textContent = `👤 ${usuarioGuardado.nombre || 'Usuario'} (${(usuarioGuardado.rol || 'PROFE').toUpperCase()})`;
        }

        function cerrarSesion() {
            fetch('/api/logout', { method: 'POST' }).finally(() => {
                localStorage.removeItem('usuario');
                window.location.replace('/index.html');
            });
        }

        let tarifasGlobal = [];

        async function cargarTarifas() {
            try {
                const res = await fetch('/api/tarifas');
                if (res.ok) {
                    tarifasGlobal = await res.json();
                    filtrarTarifas();
                }
            } catch (e) {
                console.error("Error al cargar tarifas", e);
            }
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tabla-tarifas');
            tbody.innerHTML = '';

            if (!lista || lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">No hay tarifas registradas.</td></tr>`;
                return;
            }

            lista.forEach(t => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 align-top">
                        <td class="py-3 px-3">
                            <div class="font-bold text-slate-900">${t.descripcion || 'Sin descripción'}</div>
                            <span class="inline-block bg-blue-100 text-blue-700 text-[10px] font-semibold px-2 py-0.5 rounded mt-0.5">${t.codigo}</span>
                            <div class="text-xs text-slate-500 mt-1">${t.tipo_servicio || ''}</div>
                        </td>
                        <td class="py-3 px-3 text-xs">
                            1h: <b>${t.precio_1h}€</b> | 2h: <b>${t.precio_2h}€</b><br>
                            3h: <b>${t.precio_3h}€</b> | 4h: <b>${t.precio_4h}€</b> | 5h: <b>${t.precio_5h}€</b>
                        </td>
                        <td class="py-3 px-3 text-xs font-semibold text-emerald-600">${t.tarifa_por_sesion} €</td>
                        <td class="py-3 px-3 text-[11px] text-slate-600">
                            Del ${t.fecha_inicio}<br>al ${t.fecha_fin}
                        </td>
                        <td class="py-3 px-3 text-center align-middle">
                            <button onclick="cargarParaEditar(${t.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold bg-blue-50 px-2.5 py-1 rounded transition">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filtrarTarifas() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const soloActivasHoy = document.getElementById('filtro-activas-hoy').checked;
            const hoyIso = new Date().toISOString().split('T')[0];

            const filtrados = tarifasGlobal.filter(t => {
                const coincideTexto = (t.tipo_servicio && t.tipo_servicio.toLowerCase().includes(texto)) || 
                                     (t.codigo && t.codigo.toLowerCase().includes(texto)) ||
                                     (t.descripcion && t.descripcion.toLowerCase().includes(texto));

                let coincideVigencia = true;
                if (soloActivasHoy) {
                    coincideVigencia = t.fecha_inicio <= hoyIso && t.fecha_fin >= hoyIso;
                }

                return coincideTexto && coincideVigencia;
            });

            renderizarTabla(filtrados);
        }

        async function guardarTarifa(e) {
            e.preventDefault();
            const id = document.getElementById('tarifa-id').value;

            const datos = {
                codigo: document.getElementById('codigo').value.trim().toUpperCase(),
                tipo_servicio: document.getElementById('tipo_servicio').value,
                descripcion: document.getElementById('descripcion').value.trim(),
                precio_1h: parseFloat(document.getElementById('precio_1h').value) || 0,
                precio_2h: parseFloat(document.getElementById('precio_2h').value) || 0,
                precio_3h: parseFloat(document.getElementById('precio_3h').value) || 0,
                precio_4h: parseFloat(document.getElementById('precio_4h').value) || 0,
                precio_5h: parseFloat(document.getElementById('precio_5h').value) || 0,
                tarifa_por_sesion: parseFloat(document.getElementById('tarifa_por_sesion').value) || 0,
                fecha_inicio: document.getElementById('fecha_inicio').value,
                fecha_fin: document.getElementById('fecha_fin').value,
                usuario_creacion: usuarioGuardado.nombre,
                usuario_modificacion: usuarioGuardado.nombre
            };

            const url = id ? `/api/tarifas/${id}` : '/api/tarifas';
            const metodo = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await res.json();

                if (res.ok) {
                    alert(id ? '¡Tarifa actualizada con éxito!' : '¡Tarifa registrada con éxito!');
                    limpiarFormulario();
                    cargarTarifas();
                } else {
                    alert('❌ ' + (resultado.error || 'No se pudo guardar la tarifa.'));
                }
            } catch (err) {
                alert('❌ Error de conexión al intentar guardar la tarifa.');
            }
        }

        async function borrarTarifaActual() {
            const id = document.getElementById('tarifa-id').value;
            const codigo = document.getElementById('codigo').value;

            if (!id) return;

            if (!confirm(`⚠️ ¿Estás totalmente seguro de que deseas eliminar la tarifa con código [${codigo}]?\n\nEsta acción no se puede deshacer.`)) {
                return;
            }

            try {
                const respuesta = await fetch(`/api/tarifas/${id}`, {
                    method: 'DELETE'
                });

                if (respuesta.ok) {
                    alert('🗑️ Tarifa eliminada correctamente.');
                    limpiarFormulario();
                    cargarTarifas();
                } else {
                    const resultado = await respuesta.json();
                    alert('❌ Error: ' + (resultado.error || 'No se pudo eliminar la tarifa.'));
                }
            } catch (error) {
                alert('❌ Error de conexión con el servidor.');
            }
        }

        function cargarParaEditar(id) {
            const t = tarifasGlobal.find(item => item.id === id);
            if (!t) return;

            document.getElementById('tarifa-id').value = t.id;
            document.getElementById('codigo').value = t.codigo;
            document.getElementById('tipo_servicio').value = t.tipo_servicio;
            document.getElementById('descripcion').value = t.descripcion || '';
            document.getElementById('precio_1h').value = t.precio_1h;
            document.getElementById('precio_2h').value = t.precio_2h;
            document.getElementById('precio_3h').value = t.precio_3h;
            document.getElementById('precio_4h').value = t.precio_4h;
            document.getElementById('precio_5h').value = t.precio_5h;
            document.getElementById('tarifa_por_sesion').value = t.tarifa_por_sesion;
            document.getElementById('fecha_inicio').value = t.fecha_inicio;
            document.getElementById('fecha_fin').value = t.fecha_fin;

            document.getElementById('form-titulo').textContent = 'Editar Tarifa';
            document.getElementById('btn-guardar').textContent = 'Actualizar';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            document.getElementById('btn-borrar').classList.remove('hidden'); // Muestra el botón de borrar
            
            // Hacer scroll hacia arriba dentro del propio formulario izquierdo
            const formulario = document.querySelector('.lg\\:col-span-3');
            if (formulario) formulario.scrollTop = 0;
        }

        function limpiarFormulario() {
            document.getElementById('form-tarifa').reset();
            document.getElementById('tarifa-id').value = '';
            document.getElementById('form-titulo').textContent = 'Nueva Tarifa';
            document.getElementById('btn-guardar').textContent = 'Guardar';
            document.getElementById('btn-cancelar').classList.add('hidden');
            document.getElementById('btn-borrar').classList.add('hidden'); // Oculta el botón de borrar
        }

        cargarTarifas();
    </script>
</body>
</html>
