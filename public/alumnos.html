<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen overflow-hidden">
    
    <!-- Contenedor Superior Fijo (Navbar) -->
    <div class="z-40 bg-slate-100 shadow-sm">
        <!-- Navbar superior -->
        <header class="bg-white shadow-sm border-b border-slate-200">
            <div class="w-full px-4 sm:px-8 py-3.5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-sm">
                        <img src="/Logo_Logos.png" alt="Logotipo" class="w-10 h-10 object-contain">
                    </div>
                    <h1 class="text-xl font-bold text-slate-800">🎓 Gestión de Alumnos</h1>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Volver al Panel</a>
                    <span id="info-usuario" class="text-sm font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg">Cargando...</span>
                    <button onclick="cerrarSesion()" class="bg-red-50 text-red-600 text-sm font-semibold px-4 py-2 rounded-lg hover:bg-red-100 transition">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>
    </div>

    <!-- Contenido principal con Grid adaptable y scroll independiente por bloque -->
    <main class="w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Formulario de Registro / Edición (Izquierda - Estrecho: 3 columnas) -->
        <div class="bg-white p-4 sm:p-5 rounded-xl shadow-md lg:col-span-3 h-[calc(100vh-7rem)] overflow-y-auto">
            <form id="form-alumno" onsubmit="guardarAlumno(event)" onkeydown="return event.key !== 'Enter' || event.target.tagName === 'TEXTAREA' || event.target.tagName === 'BUTTON'" class="space-y-2.5">
                <input type="hidden" id="alumno-id">
                
                <!-- Cabecera del formulario -->
                <div class="flex justify-between items-center pb-2 border-b sticky top-0 bg-white z-10">
                    <h2 id="form-titulo" class="text-base font-bold text-slate-800">Nuevo Alumno</h2>
                    <div class="flex gap-1.5">
                        <button type="button" id="btn-borrar" onclick="borrarAlumnoActual()" class="hidden bg-red-50 text-red-600 text-xs font-semibold px-2 py-1 rounded-lg hover:bg-red-100 transition">
                            Borrar
                        </button>
                        <button type="button" id="btn-cancelar" onclick="limpiarFormulario()" class="hidden bg-slate-200 text-slate-700 text-xs font-semibold px-2 py-1 rounded-lg hover:bg-slate-300 transition">
                            Cancelar
                        </button>
                        <button type="submit" id="btn-guardar" class="bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-lg hover:bg-blue-700 transition shadow-sm">
                            Guardar
                        </button>
                    </div>
                </div>

                <!-- Datos del Alumno -->
                <div class="border-b pb-2">
                    <h3 class="text-[11px] font-semibold text-blue-600 uppercase tracking-wider mb-1.5">Datos del Alumno</h3>
                    <div class="space-y-2">
                        <!-- Nombre (1 col) y Apellidos (2 cols) -->
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Nombre</label>
                                <input type="text" id="nombre" required class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Apellidos</label>
                                <input type="text" id="apellidos" required class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Curso</label>
                                <input type="text" id="curso" placeholder="Ej. 3º ESO" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                            <!-- Centro Educativo con Autocompletado y soporte de flechas -->
                            <div class="relative">
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Centro Educativo</label>
                                <input type="text" id="centro" autocomplete="off" placeholder="Escribe o busca..." oninput="filtrarSugerenciasCentro(this)" onfocus="filtrarSugerenciasCentro(this)" onkeydown="manejarTecladoCentro(event)" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                                <div id="dropdown-centros" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-md shadow-lg z-50 max-h-40 overflow-y-auto"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Fecha Comienzo</label>
                                <input type="date" id="fecha_comienzo" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Precio Terapia (€)</label>
                                <input type="number" step="0.01" id="precio_terapia" placeholder="0.00" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                        </div>

                        <!-- Check Beca -->
                        <div class="flex items-center gap-1.5 pt-0.5">
                            <input type="checkbox" id="beca" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <label for="beca" class="text-[11px] font-medium text-slate-700">¿Tiene Beca?</label>
                        </div>
                    </div>
                </div>

                <!-- Datos del Padre -->
                <div class="border-b pb-2">
                    <h3 class="text-[11px] font-semibold text-blue-600 uppercase tracking-wider mb-1.5">Datos del Padre</h3>
                    <div class="space-y-2">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Nombre del Padre</label>
                            <input type="text" id="contacto_padre" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Teléfono</label>
                                <input type="text" id="telefono_padre" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Email</label>
                                <input type="email" id="email_padre" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Datos de la Madre -->
                <div class="border-b pb-2">
                    <h3 class="text-[11px] font-semibold text-blue-600 uppercase tracking-wider mb-1.5">Datos de la Madre</h3>
                    <div class="space-y-2">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Nombre de la Madre</label>
                            <input type="text" id="contacto_madre" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Teléfono</label>
                                <input type="text" id="telefono_madre" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Email</label>
                                <input type="email" id="email_madre" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Observaciones -->
                <div>
                    <label class="block text-[11px] font-medium text-slate-700 mb-0.5">Observaciones</label>
                    <textarea id="observaciones" rows="1.5" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="Notas de interés..."></textarea>
                </div>
                
                <!-- Usuario Activo -->
                <div class="flex items-center gap-1.5 pt-1">
                    <input type="checkbox" id="activo" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked>
                    <label for="activo" class="text-xs font-medium text-slate-700">Alumno Activo</label>
                </div>
            </form>
        </div>

        <!-- Listado de Alumnos Registrados (Derecha - Ancho: 9 columnas) -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-9 h-[calc(100vh-7rem)] overflow-hidden flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-lg font-bold text-slate-800">Alumnos Registrados</h2>
                
                <!-- Filtros + Contador + Buscador -->
                <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                    <!-- Contador de alumnos con el filtro aplicado -->
                    <div class="flex items-center gap-1.5 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700">
                        <span>Total:</span>
                        <span id="contador-alumnos" class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-bold">0</span>
                    </div>

                    <!-- Selector de Estado (Activos / No activos / Todos) -->
                    <select id="filtro-estado" onchange="filtrarAlumnos()" class="text-xs font-semibold text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                        <option value="activos" selected>Activos</option>
                        <option value="no_activos">No activos</option>
                        <option value="todos">Todos</option>
                    </select>

                    <!-- Checkbox de filtro por beca -->
                    <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition">
                        <input type="checkbox" id="filtro-beca" onchange="filtrarAlumnos()" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        Solo becados
                    </label>

                    <!-- Checkbox de filtro por tarifa de terapia -->
                    <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition">
                        <input type="checkbox" id="filtro-tarifa-terapia" onchange="filtrarAlumnos()" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        Con tarifa terapia
                    </label>
                    
                    <!-- Buscador -->
                    <input type="text" id="buscador" oninput="filtrarAlumnos()" placeholder="🔍 Buscar por nombre, apellidos, centro..." class="w-full sm:w-56 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase sticky top-0 bg-white shadow-sm z-10">
                            <th class="py-2 px-3">Alumno / Curso</th>
                            <th class="py-2 px-3">Centro / Beca</th>
                            <th class="py-2 px-3">Contacto / Padres y Emails</th>
                            <th class="py-2 px-3">Condiciones / Obs.</th>
                            <th class="py-2 px-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos" class="text-slate-700 text-sm">
                        <!-- Carga dinámica automática -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuario') || '{}');
        let alumnosGlobal = [];
        let centrosGlobal = []; 
        let indiceCentroSeleccionado = -1;

        document.getElementById('info-usuario').textContent = `👤 ${usuarioGuardado.nombre} (${usuarioGuardado.rol.toUpperCase()})`;

        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\w\s]/gi, '').trim();
        }

        async function cargarCentrosListado() {
            try {
                const res = await fetch('/api/centros');
                if (res.ok) {
                    centrosGlobal = await res.json();
                }
            } catch (e) {
                console.error("Error al cargar centros", e);
            }
        }

        function filtrarSugerenciasCentro(input) {
            const query = normalizarTexto(input.value);
            const dropdown = document.getElementById('dropdown-centros');
            indiceCentroSeleccionado = -1;

            const filtrados = centrosGlobal.filter(c => {
                const nombreNorm = normalizarTexto(c.nombre);
                return nombreNorm.includes(query);
            });

            if (filtrados.length === 0) {
                dropdown.innerHTML = `<div class="px-3 py-2 text-slate-400 text-[11px]">No se encontraron centros</div>`;
                dropdown.classList.remove('hidden');
                return;
            }

            let html = '';
            filtrados.forEach((c, idx) => {
                const nombreSeguro = c.nombre.replace(/'/g, "\\'");
                html += `<div data-index="${idx}" onclick="seleccionarCentro('${nombreSeguro}')" 
                              class="opcion-centro px-3 py-1.5 hover:bg-blue-50 cursor-pointer text-slate-700 text-[11px] font-medium border-b border-slate-100 last:border-none">
                            🏫 ${c.nombre}
                         </div>`;
            });

            dropdown.innerHTML = html;
            dropdown.classList.remove('hidden');
        }

        function manejarTecladoCentro(e) {
            const dropdown = document.getElementById('dropdown-centros');
            const opciones = dropdown.querySelectorAll('.opcion-centro');

            if (dropdown.classList.contains('hidden') || opciones.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                indiceCentroSeleccionado = (indiceCentroSeleccionado + 1) % opciones.length;
                actualizarSeleccionVisualCentro(opciones);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                indiceCentroSeleccionado = (indiceCentroSeleccionado - 1 + opciones.length) % opciones.length;
                actualizarSeleccionVisualCentro(opciones);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (indiceCentroSeleccionado >= 0 && opciones[indiceCentroSeleccionado]) {
                    opciones[indiceCentroSeleccionado].click();
                }
            }
        }

        function actualizarSeleccionVisualCentro(opciones) {
            opciones.forEach((op, idx) => {
                if (idx === indiceCentroSeleccionado) {
                    op.classList.add('bg-blue-100');
                    op.scrollIntoView({ block: 'nearest' });
                } else {
                    op.classList.remove('bg-blue-100');
                }
            });
        }

        function seleccionarCentro(nombreCentro) {
            document.getElementById('centro').value = nombreCentro;
            document.getElementById('dropdown-centros').classList.add('hidden');
            indiceCentroSeleccionado = -1;
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#centro') && !e.target.closest('#dropdown-centros')) {
                const dropdown = document.getElementById('dropdown-centros');
                if (dropdown) dropdown.classList.add('hidden');
            }
        });

        async function cargarAlumnos() {
            try {
                const respuesta = await fetch('/api/alumnos');
                alumnosGlobal = await respuesta.json();
                renderizarTabla(filtrarListaAlumnos(alumnosGlobal));
            } catch (error) {
                console.error("Error al cargar los alumnos:", error);
            }
        }
        
        function cerrarSesion() {
            fetch('/api/logout', { method: 'POST' }).finally(() => {
                localStorage.removeItem('usuario');
                window.location.replace('/index.html');
            });
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tabla-alumnos');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">No se encontraron alumnos con los criterios seleccionados.</td></tr>`;
                return;
            }

            lista.forEach(a => {
                let infoPadres = [];
                if (a.contacto_padre || a.telefono_padre || a.email_padre) {
                    infoPadres.push(`<b>P:</b> ${a.contacto_padre || '-'} (${a.telefono_padre || 'Sin telf'})<br><span class="text-slate-400 text-[11px]">${a.email_padre || 'Sin email'}</span>`);
                }
                if (a.contacto_madre || a.telefono_madre || a.email_madre) {
                    infoPadres.push(`<b>M:</b> ${a.contacto_madre || '-'} (${a.telefono_madre || 'Sin telf'})<br><span class="text-slate-400 text-[11px]">${a.email_madre || 'Sin email'}</span>`);
                }
                
                const badgeEstado = a.activo === 0 
                    ? '<span class="bg-red-100 text-red-700 text-[10px] font-semibold px-2 py-0.5 rounded">Baja</span>' 
                    : '<span class="bg-green-100 text-green-700 text-[10px] font-semibold px-2 py-0.5 rounded">Activo</span>';

                const badgeBeca = a.beca === 1 
                    ? '<span class="bg-purple-100 text-purple-700 text-[10px] font-semibold px-2 py-0.5 rounded ml-1">Beca</span>' 
                    : '';

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 align-top">
                        <td class="py-3 px-3">
                            <div class="font-bold text-slate-900">${a.apellidos}, ${a.nombre}</div>
                            <div class="text-xs text-blue-600 font-medium">${a.curso || 'Sin curso'}</div>
                        </td>
                        <td class="py-3 px-3 text-xs">
                            <div class="font-medium text-slate-800">${a.centro || 'Sin centro asignado'}</div>
                            <div class="mt-1">${badgeBeca} ${badgeEstado}</div>
                        </td>
                        <td class="py-3 px-3 text-xs text-slate-600 space-y-1">
                            ${infoPadres.length > 0 ? infoPadres.join('<div class="border-t border-slate-100 my-1"></div>') : '<span class="text-slate-400">Sin datos</span>'}
                        </td>                        
                        <td class="py-3 px-3 text-xs space-y-1">
                            <div><b>Inicio:</b> ${a.fecha_comienzo || '-'}</div>
                            <div class="text-emerald-600 font-semibold"><b>Precio:</b> ${a.precio_terapia ? a.precio_terapia + ' €' : 'Estándar'}</div>
                            <div class="text-slate-500 italic mt-1 max-w-xs truncate" title="${a.observaciones || ''}"><b>Obs:</b> ${a.observaciones || '-'}</div>
                        </td>                    
                        <td class="py-3 px-3 text-center align-middle">
                            <button onclick="cargarParaEditar(${a.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold bg-blue-50 px-2.5 py-1 rounded transition">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filtrarListaAlumnos(datos) {
            const textoBuscado = normalizarTexto(document.getElementById('buscador').value);
            const estadoValor = document.getElementById('filtro-estado').value; // 'activos', 'no_activos', 'todos'
            const soloBecados = document.getElementById('filtro-beca').checked;
            const soloConTarifa = document.getElementById('filtro-tarifa-terapia').checked;

            const filtrados = datos.filter(a => {
                const nombreNorm = normalizarTexto(a.nombre);
                const apellidosNorm = normalizarTexto(a.apellidos);
                const cursoNorm = normalizarTexto(a.curso);
                const centroNorm = normalizarTexto(a.centro);
                const contactoPadreNorm = normalizarTexto(a.contacto_padre);
                const contactoMadreNorm = normalizarTexto(a.contacto_madre);
                const emailPadreNorm = normalizarTexto(a.email_padre);
                const emailMadreNorm = normalizarTexto(a.email_madre);

                const cumpleTexto = (
                    nombreNorm.includes(textoBuscado) || 
                    apellidosNorm.includes(textoBuscado) ||
                    cursoNorm.includes(textoBuscado) ||
                    centroNorm.includes(textoBuscado)
                );

                let cumpleEstado = true;
                if (estadoValor === 'activos') {
                    cumpleEstado = (a.activo === 1 || a.activo === true);
                } else if (estadoValor === 'no_activos') {
                    cumpleEstado = (a.activo === 0 || a.activo === false || a.activo === '0');
                }

                const cumpleBeca = !soloBecados || (a.beca === 1);
                const cumpleTarifa = !soloConTarifa || (a.precio_terapia && parseFloat(a.precio_terapia) > 0);

                return cumpleTexto && cumpleEstado && cumpleBeca && cumpleTarifa;
            });

            // Actualizar el contador en pantalla
            const contadorEl = document.getElementById('contador-alumnos');
            if (contadorEl) {
                contadorEl.textContent = filtrados.length;
            }

            return filtrados;
        }

        function filtrarAlumnos() {
            const filtrados = filtrarListaAlumnos(alumnosGlobal);
            renderizarTabla(filtrados);
        }

        async function guardarAlumno(e) {
            e.preventDefault();
            
            const id = document.getElementById('alumno-id').value;
            const nombreInput = document.getElementById('nombre').value.trim();
            const apellidosInput = document.getElementById('apellidos').value.trim();

            const nombreNormalizado = normalizarTexto(nombreInput);
            const apellidosNormalizados = normalizarTexto(apellidosInput);

            const duplicado = alumnosGlobal.find(a => 
                normalizarTexto(a.nombre) === nombreNormalizado && 
                normalizarTexto(a.apellidos) === apellidosNormalizados &&
                a.id !== (id ? parseInt(id) : null)
            );

            if (duplicado) {
                if (confirm(`⚠️ Ya existe un alumno registrado con un nombre similar ("${duplicado.nombre} ${duplicado.apellidos}").\n\n¿Deseas cargar sus datos para modificarlos?`)) {
                    cargarParaEditar(duplicado.id);
                }
                return;
            }

            const datos = {
                nombre: nombreInput,
                apellidos: apellidosInput,
                curso: document.getElementById('curso').value.trim(),
                centro: document.getElementById('centro').value.trim(),
                fecha_comienzo: document.getElementById('fecha_comienzo').value,
                precio_terapia: parseFloat(document.getElementById('precio_terapia').value) || 0,
                beca: document.getElementById('beca').checked ? 1 : 0,
                contacto_padre: document.getElementById('contacto_padre').value.trim(),
                telefono_padre: document.getElementById('telefono_padre').value.trim(),
                email_padre: document.getElementById('email_padre').value.trim(),
                contacto_madre: document.getElementById('contacto_madre').value.trim(),
                telefono_madre: document.getElementById('telefono_madre').value.trim(),
                email_madre: document.getElementById('email_madre').value.trim(),
                activo: document.getElementById('activo').checked ? 1 : 0,
                observaciones: document.getElementById('observaciones').value.trim(),
                creado_por: usuarioGuardado.nombre || 'Desconocido',
                modificado_por: usuarioGuardado.nombre || 'Desconocido'
            };

            const url = id ? `/api/alumnos/${id}` : '/api/alumnos';
            const metodo = id ? 'PUT' : 'POST';

            try {
                const respuesta = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert(id ? '¡Alumno actualizado con éxito!' : '¡Alumno registrado con éxito!');
                    limpiarFormulario();
                    cargarAlumnos();
                } else {
                    alert('❌ Error: ' + (resultado.error || 'No se pudo guardar el alumno.'));
                }
            } catch (error) {
                alert('❌ Error de conexión con el servidor');
            }
        }
        
        async function borrarAlumnoActual() {
            const id = document.getElementById('alumno-id').value;
            const nombre = document.getElementById('nombre').value;
            const apellidos = document.getElementById('apellidos').value;

            if (!id) return;

            if (!confirm(`⚠️ ¿Estás totalmente seguro de que deseas eliminar al alumno "${apellidos}, ${nombre}"?\n\nEsta acción no se puede deshacer.`)) {
                return;
            }

            try {
                const respuesta = await fetch(`/api/alumnos/${id}`, {
                    method: 'DELETE'
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert('🗑️ Alumno eliminado correctamente.');
                    limpiarFormulario();
                    cargarAlumnos();
                } else {
                    alert('❌ No se pudo eliminar: ' + (resultado.error || 'El alumno está vinculado a una asignación.'));
                }
            } catch (error) {
                alert('❌ Error de conexión con el servidor.');
            }
        }

        function cargarParaEditar(id) {
            const alumno = alumnosGlobal.find(a => a.id === id);
            if (!alumno) return;

            document.getElementById('alumno-id').value = alumno.id;
            document.getElementById('nombre').value = alumno.nombre;
            document.getElementById('apellidos').value = alumno.apellidos;
            document.getElementById('curso').value = alumno.curso || '';
            document.getElementById('centro').value = alumno.centro || '';
            document.getElementById('fecha_comienzo').value = alumno.fecha_comienzo || '';
            document.getElementById('precio_terapia').value = alumno.precio_terapia || '';
            document.getElementById('beca').checked = alumno.beca === 1;
            document.getElementById('contacto_padre').value = alumno.contacto_padre || '';
            document.getElementById('telefono_padre').value = alumno.telefono_padre || '';
            document.getElementById('email_padre').value = alumno.email_padre || '';
            document.getElementById('contacto_madre').value = alumno.contacto_madre || '';
            document.getElementById('telefono_madre').value = alumno.telefono_madre || '';
            document.getElementById('email_madre').value = alumno.email_madre || '';
            document.getElementById('activo').checked = alumno.activo === 1;
            document.getElementById('observaciones').value = alumno.observaciones || '';

            document.getElementById('form-titulo').textContent = 'Editar Alumno';
            document.getElementById('btn-guardar').textContent = 'Actualizar';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            document.getElementById('btn-borrar').classList.remove('hidden');
            
            const formulario = document.querySelector('.lg\\:col-span-3');
            if (formulario) formulario.scrollTop = 0;
        }

        function limpiarFormulario() {
            document.getElementById('form-alumno').reset();
            document.getElementById('alumno-id').value = '';
            document.getElementById('activo').checked = true;
            document.getElementById('form-titulo').textContent = 'Nuevo Alumno';
            document.getElementById('btn-guardar').textContent = 'Guardar';
            document.getElementById('btn-cancelar').classList.add('hidden');
            document.getElementById('btn-borrar').classList.add('hidden');
        }
        
        cargarCentrosListado();
        cargarAlumnos();
    </script>
</body>
</html>
