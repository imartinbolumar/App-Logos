<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <!-- Navbar superior -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800">🎓 Gestión de Alumnos</h1>
            <a href="/dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Volver al Panel</a>
        </div>
    </header>

    <!-- Contenido principal con Grid adaptable -->
    <main class="w-full max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- Formulario de Registro / Edición (Izquierda - Altura controlada y scroll interno) -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-1 lg:sticky lg:top-6 max-h-[calc(100vh-7rem)] overflow-y-auto">
            <form id="form-alumno" onsubmit="guardarAlumno(event)" class="space-y-4">
                <input type="hidden" id="alumno-id">
                
                <!-- Cabecera del formulario con Título y Botones arriba a la derecha -->
                <div class="flex justify-between items-center pb-3 border-b sticky top-0 bg-white z-10">
                    <h2 id="form-titulo" class="text-lg font-bold text-slate-800">Nuevo Alumno</h2>
                    <div class="flex gap-2">
                        <button type="button" id="btn-cancelar" onclick="limpiarFormulario()" class="hidden bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-slate-300 transition">
                            Cancelar
                        </button>
                        <button type="submit" id="btn-guardar" class="bg-blue-600 text-white text-xs font-semibold px-4 py-1.5 rounded-lg hover:bg-blue-700 transition shadow-sm">
                            Guardar
                        </button>
                    </div>
                </div>

                <!-- Datos del Alumno -->
                <div class="border-b pb-3">
                    <h3 class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">Datos del Alumno</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Nombre</label>
                            <input type="text" id="nombre" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Apellidos</label>
                            <input type="text" id="apellidos" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Datos del Padre -->
                <div class="border-b pb-3">
                    <h3 class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">Datos del Padre</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Nombre del Padre</label>
                            <input type="text" id="contacto_padre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">Teléfono</label>
                                <input type="text" id="telefono_padre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
                                <input type="email" id="email_padre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Datos de la Madre -->
                <div class="border-b pb-3">
                    <h3 class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">Datos de la Madre</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Nombre de la Madre</label>
                            <input type="text" id="contacto_madre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">Teléfono</label>
                                <input type="text" id="telefono_madre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
                                <input type="email" id="email_madre" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Observaciones -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Observaciones</label>
                    <textarea id="observaciones" rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Notas de interés..."></textarea>
                </div>
            </form>
        </div>

        <!-- Listado de Alumnos Registrados (Derecha) -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-2 overflow-hidden flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-lg font-bold text-slate-800">Alumnos Registrados</h2>
                <!-- Buscador -->
                <input type="text" id="buscador" oninput="filtrarAlumnos()" placeholder="🔍 Buscar por nombre, apellidos..." class="w-full sm:w-72 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase">
                            <th class="py-2 px-3">ID</th>
                            <th class="py-2 px-3">Alumno</th>
                            <th class="py-2 px-3">Padre / Madre (Contacto)</th>
                            <th class="py-2 px-3">Observaciones</th>
                            <th class="py-2 px-3">Auditoría</th>
                            <th class="py-2 px-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos" class="text-slate-700 text-sm">
                        <!-- Carga dinámica automática -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuario') || '{}');
        let alumnosGlobal = [];

        // Carga automática al entrar
        async function cargarAlumnos() {
            try {
                console.log("Datos recibidos del servidor:", alumnosGlobal);
                const respuesta = await fetch('/api/alumnos');
                alumnosGlobal = await respuesta.json();
                renderizarTabla(alumnosGlobal);
                console.log("ador:", alumnosGlobal);
            } catch (error) {
                console.error("Error al cargar los alumnos:", error);
            }
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tabla-alumnos');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-400">No se encontraron alumnos registrados.</td></tr>`;
                return;
            }

            lista.forEach(a => {
                const fechaAlta = new Date(a.creado_en).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const fechaMod = a.modificado_en ? new Date(a.modificado_en).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : null;

                let infoPadres = [];
                if (a.contacto_padre || a.telefono_padre || a.email_padre) {
                    infoPadres.push(`<strong>Padre:</strong> ${a.contacto_padre || '-'} (${a.telefono_padre || 'Sin telf'}) [${a.email_padre || 'Sin email'}]`);
                }
                if (a.contacto_madre || a.telefono_madre || a.email_madre) {
                    infoPadres.push(`<strong>Madre:</strong> ${a.contacto_madre || '-'} (${a.telefono_madre || 'Sin telf'}) [${a.email_madre || 'Sin email'}]`);
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 align-top">
                        <td class="py-3 px-3 font-mono text-xs font-bold text-slate-500">#${a.id}</td>
                        <td class="py-3 px-3 font-medium text-slate-900">${a.apellidos}, ${a.nombre}</td>
                        <td class="py-3 px-3 text-xs text-slate-600 space-y-1">
                            ${infoPadres.length > 0 ? infoPadres.join('<br>') : '<span class="text-slate-400">Sin datos</span>'}
                        </td>
                        <td class="py-3 px-3 text-xs text-slate-500 max-w-xs truncate">${a.observaciones || '-'}</td>
                        <td class="py-3 px-3 text-xs text-slate-400 space-y-1">
                            <div><span class="font-medium text-slate-600">Creado:</span> ${a.creado_por || 'Sistema'} (${fechaAlta})</div>
                            ${a.modificado_por ? `<div><span class="font-medium text-slate-600">Modif:</span> ${a.modificado_por} (${fechaMod})</div>` : ''}
                        </td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="cargarParaEditar(${a.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold bg-blue-50 px-2 py-1 rounded transition">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filtrarAlumnos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = alumnosGlobal.filter(a => 
                a.nombre.toLowerCase().includes(texto) || 
                a.apellidos.toLowerCase().includes(texto) ||
                (a.telefono_padre && a.telefono_padre.includes(texto)) ||
                (a.telefono_madre && a.telefono_madre.includes(texto))
            );
            renderizarTabla(filtrados);
        }

        async function guardarAlumno(e) {
            e.preventDefault();
            
            const id = document.getElementById('alumno-id').value;
            const datos = {
                nombre: document.getElementById('nombre').value.trim(),
                apellidos: document.getElementById('apellidos').value.trim(),
                contacto_padre: document.getElementById('contacto_padre').value.trim(),
                telefono_padre: document.getElementById('telefono_padre').value.trim(),
                email_padre: document.getElementById('email_padre').value.trim(),
                contacto_madre: document.getElementById('contacto_madre').value.trim(),
                telefono_madre: document.getElementById('telefono_madre').value.trim(),
                email_madre: document.getElementById('email_madre').value.trim(),
                observaciones: document.getElementById('observaciones').value.trim(),
                creado_por: usuarioGuardado.nombre || 'Desconocido',
                modificado_por: usuarioGuardado.nombre || 'Desconocido'
            };

            const url = id ? `/api/alumnos/${id}` : '/api/alumnos';
            const metodo = id ? 'PUT' : 'POST';

            try {
                const respuesta = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert(id ? '¡Alumno actualizado con éxito!' : '¡Alumno registrado con éxito!');
                    limpiarFormulario();
                    cargarAlumnos();
                } else {
                    if (resultado.error === 'YA_EXISTE') {
                        const existente = alumnosGlobal.find(a => a.nombre.toLowerCase() === datos.nombre.toLowerCase() && a.apellidos.toLowerCase() === datos.apellidos.toLowerCase());
                        if (existente) {
                            if (confirm(`⚠️ Ya existe un alumno registrado con el nombre "${datos.nombre} ${datos.apellidos}".\n\n¿Deseas cargar sus datos para modificarlos?`)) {
                                cargarParaEditar(existente.id);
                            }
                        } else {
                            alert('⚠️ Ya existe un alumno con ese mismo nombre y apellidos.');
                        }
                    } else {
                        alert('❌ Error: ' + resultado.error);
                    }
                }
            } catch (error) {
                alert('❌ Error de conexión con el servidor');
            }
        }

        function cargarParaEditar(id) {
            const alumno = alumnosGlobal.find(a => a.id === id);
            if (!alumno) return;

            document.getElementById('alumno-id').value = alumno.id;
            document.getElementById('nombre').value = alumno.nombre;
            document.getElementById('apellidos').value = alumno.apellidos;
            document.getElementById('contacto_padre').value = alumno.contacto_padre || '';
            document.getElementById('telefono_padre').value = alumno.telefono_padre || '';
            document.getElementById('email_padre').value = alumno.email_padre || '';
            document.getElementById('contacto_madre').value = alumno.contacto_madre || '';
            document.getElementById('telefono_madre').value = alumno.telefono_madre || '';
            document.getElementById('email_madre').value = alumno.email_madre || '';
            document.getElementById('observaciones').value = alumno.observaciones || '';

            document.getElementById('form-titulo').textContent = 'Editar Alumno';
            document.getElementById('btn-guardar').textContent = 'Actualizar';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limpiarFormulario() {
            document.getElementById('form-alumno').reset();
            document.getElementById('alumno-id').value = '';
            document.getElementById('form-titulo').textContent = 'Nuevo Alumno';
            document.getElementById('btn-guardar').textContent = 'Guardar';
            document.getElementById('btn-cancelar').classList.add('hidden');
        }

        cargarAlumnos();
    </script>
</body>
</html>
