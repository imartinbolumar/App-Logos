<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <!-- Navbar superior -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800">🛡️ Gestión de Usuarios (Admin)</h1>
            <a href="/dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Volver al Panel</a>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="w-full max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- Formulario de Alta / Edición de Usuario -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-1 lg:sticky lg:top-6 max-h-[calc(100vh-7rem)] overflow-y-auto">
            <form id="form-usuario" onsubmit="guardarUsuario(event)" autocomplete="off" class="space-y-4">
                <input type="hidden" id="usuario-id">
                
                <!-- Cabecera del formulario -->
                <div class="flex justify-between items-center pb-3 border-b sticky top-0 bg-white z-10">
                    <h2 id="form-titulo" class="text-lg font-bold text-slate-800">Nuevo Usuario</h2>
                    <div class="flex gap-2">
                        <button type="button" id="btn-cancelar" onclick="limpiarFormulario()" class="hidden bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-slate-300 transition">
                            Cancelar
                        </button>
                        <button type="submit" id="btn-guardar" class="bg-blue-600 text-white text-xs font-semibold px-4 py-1.5 rounded-lg hover:bg-blue-700 transition shadow-sm">
                            Guardar
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nombre</label>
                        <input type="text" id="nombre" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Correo Electrónico (Email)</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Contraseña</label>
                        <input type="password" id="password" autocomplete="new-password" placeholder="Dejar en blanco para no cambiar al editar" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Rol de Acceso</label>
                        <select id="rol" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="profesor">Profesor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" id="activo" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <label for="activo" class="text-sm font-medium text-slate-700">Usuario Activo</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- Listado de Usuarios Registrados -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-2 overflow-hidden flex flex-col">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Usuarios del Sistema</h2>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase">
                            <th class="py-2 px-3">ID</th>
                            <th class="py-2 px-3">Nombre</th>
                            <th class="py-2 px-3">Email</th>
                            <th class="py-2 px-3">Rol</th>
                            <th class="py-2 px-3">Activo</th>
                            <th class="py-2 px-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="text-slate-700 text-sm">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // 🔒 1. CONTROL DE ACCESO: Verificar si el usuario conectado es Administrador
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuarioGuardado.rol !== 'admin') {
            alert('⛔ Acceso denegado. Esta sección es exclusiva para administradores.');
            window.location.href = '/dashboard.html';
        }

        let usuariosGlobal = [];

        async function cargarUsuarios() {
            try {
                console.log("Pidiendo usuarios al servidor...");
                const respuesta = await fetch('/api/usuarios');
                const data = await respuesta.json();
                
                console.log("Respuesta recibida del servidor:", data);

                // Comprobamos si el servidor devolvió un array o un error
                if (Array.isArray(data)) {
                    usuariosGlobal = data;
                    renderizarTabla(usuariosGlobal);
                } else {
                    console.error("El servidor no devolvió una lista válida:", data);
                    document.getElementById('tabla-usuarios').innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-500">Error: ${data.error || 'Respuesta inválida del servidor'}</td></tr>`;
                }
            } catch (error) {
                console.error("Error de red al cargar los usuarios:", error);
                document.getElementById('tabla-usuarios').innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-500">Error de conexión con el servidor.</td></tr>`;
            }
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tabla-usuarios');
            tbody.innerHTML = '';

            if (!lista || lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">No hay usuarios registrados.</td></tr>`;
                return;
            }

            lista.forEach(u => {
                const badgeRol = u.rol === 'admin' 
                    ? '<span class="bg-purple-100 text-purple-700 text-xs font-semibold px-2 py-0.5 rounded">Admin</span>' 
                    : '<span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded">Profesor</span>';
                
                const badgeEstado = u.activo === 0 
                    ? '<span class="bg-red-100 text-red-700 text-xs font-semibold px-2 py-0.5 rounded">Baja</span>' 
                    : '<span class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded">Activo</span>';

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 align-middle">
                        <td class="py-3 px-3 font-mono text-xs font-bold text-slate-500">#${u.id}</td>
                        <td class="py-3 px-3 font-medium text-slate-900">${u.nombre}</td>
                        <td class="py-3 px-3 text-xs text-slate-600">${u.email}</td>
                        <td class="py-3 px-3 text-xs">${badgeRol}</td>          
                        <td class="py-3 px-3 text-xs">${badgeEstado}</td>              
                        <td class="py-3 px-3 text-center">
                            <button onclick="cargarParaEditar(${u.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold bg-blue-50 px-2 py-1 rounded transition">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarUsuario(e) {
            e.preventDefault();
            
            const id = document.getElementById('usuario-id').value;
            const datos = {
                nombre: document.getElementById('nombre').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                rol: document.getElementById('rol').value
            };

            // Si hay ID es una modificación (PUT), si no, es un registro nuevo (POST)
            const url = id ? `/api/usuarios/${id}` : '/api/usuarios';
            const metodo = id ? 'PUT' : 'POST';
            
            try {
                const respuesta = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert(id ? '¡Usuario actualizado con éxito!' : '¡Usuario registrado con éxito!');
                    limpiarFormulario();
                    cargarUsuarios(); // Recarga la tabla de inmediato
                } else {
                    alert('❌ Error: ' + (resultado.error || 'No se pudo completar la operación'));
                }
            } catch (error) {
                console.error('Error de red:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        }

        function cargarParaEditar(id) {
            console.log("Intentando editar el usuario ID:", id);
            console.log("Lista actual de usuarios:", usuariosGlobal);

            const usuario = usuariosGlobal.find(u => u.id === id);
            
            if (!usuario) {
                alert("⚠️ No se pudieron cargar los datos de este usuario porque la lista está vacía o no se encontró.");
                return;
            }

            document.getElementById('usuario-id').value = usuario.id;
            document.getElementById('nombre').value = usuario.nombre;
            document.getElementById('email').value = usuario.email;
            document.getElementById('password').value = ''; // Limpiamos la contraseña por seguridad
            document.getElementById('rol').value = usuario.rol;

            document.getElementById('form-titulo').textContent = 'Editar Usuario';
            document.getElementById('btn-guardar').textContent = 'Actualizar';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limpiarFormulario() {
            document.getElementById('form-usuario').reset();
            document.getElementById('usuario-id').value = '';
            document.getElementById('form-titulo').textContent = 'Nuevo Usuario';
            document.getElementById('btn-guardar').textContent = 'Guardar';
            document.getElementById('btn-cancelar').classList.add('hidden');
        }

        
        // 🕒 Forzar la limpieza un instante después de cargar para evitar el autocompletado agresivo del navegador
        setTimeout(() => {
            limpiarFormulario();
        }, 100);

        // Cargar listado al abrir
        cargarUsuarios();

    </script>
